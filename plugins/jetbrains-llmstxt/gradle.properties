# Plugin coordinates
pluginGroup=com.agiscorecard
# Paid-plugin rule: the version MUST start with the release-version digits (20261 -> 2026.1.x).
pluginVersion=2026.1.0
# JetBrains Marketplace product descriptor (paid plugin).
pluginReleaseVersion=20261
# Pin the release date (yyyyMMdd) for a real Marketplace release; when unset the
# build stamps the current date over the __RELEASE_DATE__ placeholder in plugin.xml.
#pluginReleaseDate=20260901

# Target platform: IntelliJ IDEA Community 2024.2 line (sinceBuild 242, no untilBuild).
platformVersion=2024.2.4

# The IntelliJ Platform bundles the Kotlin stdlib; do not duplicate it in the plugin zip.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx1536m
