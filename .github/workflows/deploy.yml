name: Deploy sites to Cloudflare

on:
  push:
    branches: [main, master, "claude/sales-website-research-plan-7i7rc2"]
    paths: ["sites/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [agentready, selltoagents, closecalc, agentfront, mcppulse, glossary, tools, x402]
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites/${{ matrix.site }}
          wranglerVersion: "4.112.0"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify all three sites are live
        run: |
          set -e
          # Custom-domain DNS may take a couple of minutes right after first attach — retry.
          for site in agentready selltoagents closecalc mcppulse glossary tools x402; do
            url="https://${site}.agiscorecard.com"
            ok=""
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url/" || true)
              llms=$(curl -s -o /dev/null -w "%{http_code}" "$url/llms.txt" || true)
              smap=$(curl -s -o /dev/null -w "%{http_code}" "$url/sitemap.xml" || true)
              echo "$site attempt $attempt: / -> $code, /llms.txt -> $llms, /sitemap.xml -> $smap"
              if [ "$code" = "200" ] && [ "$llms" = "200" ] && [ "$smap" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            [ -n "$ok" ] || { echo "::error::$site is not healthy after retries"; exit 1; }
          done
      - name: Verify x402 payment gate is armed
        run: |
          set -e
          body=$(curl -s --retry 6 --retry-delay 10 --retry-all-errors https://x402.agiscorecard.com/.well-known/x402)
          echo "$body" | head -c 400
          echo "$body" | grep -q '"payToConfigured": *true' || { echo "::error::x402 payTo not configured in live catalog"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://x402.agiscorecard.com/api/scan?url=https://example.com")
          [ "$code" = "402" ] || { echo "::error::expected 402 challenge from unpaid /api/scan, got $code"; exit 1; }

      - name: Verify key content pages resolve (extensionless routing)
        run: |
          set -e
          for url in \
            "https://tools.agiscorecard.com/xml-sitemap-generator" \
            "https://tools.agiscorecard.com/meta-tag-generator" \
            "https://tools.agiscorecard.com/faq-schema-generator" \
            "https://tools.agiscorecard.com/acp-feed-converter" \
            "https://tools.agiscorecard.com/mcp-server-card-generator" \
            "https://tools.agiscorecard.com/ai-catalog-generator" \
            "https://tools.agiscorecard.com/a2a-agent-card-generator" \
            "https://tools.agiscorecard.com/json-ld-rich-results-checker" \
            "https://tools.agiscorecard.com/well-known-checker" \
            "https://agentready.agiscorecard.com/pricing" \
            "https://agentready.agiscorecard.com/status" \
            "https://agentready.agiscorecard.com/get-verified" \
            "https://agentready.agiscorecard.com/verified" \
            "https://glossary.agiscorecard.com/ai-agent" \
            "https://glossary.agiscorecard.com/prompt-injection" \
            "https://glossary.agiscorecard.com/mcp-tool"; do
            ok=""
            # Brand-new asset paths can 404 on an edge for a few seconds post-deploy — retry.
            for attempt in $(seq 1 6); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
              if [ "$code" = "200" ]; then ok=1; echo "$url -> 200 (attempt $attempt)"; break; fi
              echo "$url -> $code (attempt $attempt, retrying)"; sleep 10
            done
            [ -n "$ok" ] || { echo "::error::$url did not return 200 after retries"; exit 1; }
          done
      - name: Verify monitor endpoint is wired (validation, no side effects)
        run: |
          set -e
          # Invalid email is rejected (400) before any scan or KV write — confirms the route exists.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST "https://agentready.agiscorecard.com/api/monitor" \
            -H "Content-Type: application/json" -d '{"email":"not-an-email","url":"example.com"}' || true)
          echo "/api/monitor invalid-email -> $code"
          [ "$code" = "400" ] || { echo "::error::/api/monitor did not validate (expected 400, got $code)"; exit 1; }
      - name: Verify billing/alert endpoints are wired and safe-by-default
        run: |
          set -e
          # New worker routes can lag across edges for a few seconds post-deploy — retry.
          check() { # $1=desc  $2=curl-args...  expects 400 or 401
            local desc="$1"; shift
            for attempt in $(seq 1 6); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$@" || true)
              if [ "$code" = "400" ] || [ "$code" = "401" ]; then echo "$desc -> $code (attempt $attempt)"; return 0; fi
              echo "$desc -> $code (attempt $attempt, retrying)"; sleep 10
            done
            echo "::error::$desc not guarded (last code $code)"; return 1
          }
          # Billing webhook must reject unauthenticated calls (never mutates plans without a verified signature).
          check "billing webhook (unauth)" -X POST "https://agentready.agiscorecard.com/api/billing/webhook" -H "Content-Type: application/json" -d '{"eventType":"subscription.paid","customer":{"email":"x@example.com"}}'
          # Test-alert endpoint refuses without CRON_SECRET configured.
          check "monitor test (unconfigured)" "https://agentready.agiscorecard.com/api/monitor/test?to=x@example.com"
          # Status endpoint is wired (missing params -> 400, proves it isn't falling through to assets).
          check "monitor status (no params)" "https://agentready.agiscorecard.com/api/monitor/status"
          # Verify endpoint validates (invalid email -> 400, no scan/write).
          check "verify (invalid email)" -X POST "https://agentready.agiscorecard.com/api/verify" -H "Content-Type: application/json" -d '{"email":"nope","url":"example.com"}'
      - name: Verify badge SVG endpoint
        run: |
          set -e
          ok=""
          for attempt in $(seq 1 6); do
            ctype=$(curl -s -o /dev/null -w "%{content_type}" --max-time 30 "https://agentready.agiscorecard.com/badge/none.svg" || true)
            echo "badge content-type: $ctype (attempt $attempt)"
            echo "$ctype" | grep -q "image/svg" && { ok=1; break; }
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::badge did not return SVG"; exit 1; }
      - name: Verify scanner API end-to-end
        run: |
          set -e
          out=$(curl -s --max-time 60 "https://agentready.agiscorecard.com/api/scan?url=https%3A%2F%2Fwww.cloudflare.com")
          echo "$out" | head -c 600; echo
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d.get('score'), int) and d.get('checks'), d; print('scan OK: score', d['score'], 'grade', d['grade'], len(d['checks']), 'checks')"
      - name: Verify MCP Pulse scanner end-to-end
        run: |
          set -e
          # Scan a well-known public streamable-HTTP MCP endpoint (Cloudflare docs MCP).
          out=$(curl -s --max-time 60 "https://mcppulse.agiscorecard.com/api/scan?url=https%3A%2F%2Fdocs.mcp.cloudflare.com%2Fmcp")
          echo "$out" | head -c 600; echo
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d.get('score'), int) and d.get('checks'), d; print('mcp scan OK: score', d['score'], 'grade', d['grade'], 'latency', d.get('latencyMs'), 'ms')"
      - name: Verify well-known discovery API end-to-end
        run: |
          set -e
          out=$(curl -s --max-time 60 "https://tools.agiscorecard.com/api/wellknown?url=https%3A%2F%2Fagentready.agiscorecard.com")
          echo "$out" | head -c 600; echo
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d.get('score'), int) and d.get('checks'), d; print('wellknown OK: score', d['score'], d['present'],'/',d['total'],'present')"
      - name: Verify MCP Pulse badge endpoint
        run: |
          set -e
          ctype=$(curl -s -o /dev/null -w "%{content_type}" --max-time 60 "https://mcppulse.agiscorecard.com/api/badge?url=https%3A%2F%2Fdocs.mcp.cloudflare.com%2Fmcp")
          echo "badge content-type: $ctype"
          echo "$ctype" | grep -q "image/svg" || { echo "::error::badge did not return SVG"; exit 1; }
