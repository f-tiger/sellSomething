name: Deploy sites to Cloudflare

on:
  push:
    branches: [main, master, "claude/sales-website-research-plan-7i7rc2"]
    paths: ["sites/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [agentready, selltoagents, closecalc, agentfront, mcppulse, glossary, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites/${{ matrix.site }}
          wranglerVersion: "4.112.0"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify all three sites are live
        run: |
          set -e
          # Custom-domain DNS may take a couple of minutes right after first attach — retry.
          for site in agentready selltoagents closecalc mcppulse glossary tools; do
            url="https://${site}.agiscorecard.com"
            ok=""
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url/" || true)
              llms=$(curl -s -o /dev/null -w "%{http_code}" "$url/llms.txt" || true)
              smap=$(curl -s -o /dev/null -w "%{http_code}" "$url/sitemap.xml" || true)
              echo "$site attempt $attempt: / -> $code, /llms.txt -> $llms, /sitemap.xml -> $smap"
              if [ "$code" = "200" ] && [ "$llms" = "200" ] && [ "$smap" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            [ -n "$ok" ] || { echo "::error::$site is not healthy after retries"; exit 1; }
          done
      - name: Verify key content pages resolve (extensionless routing)
        run: |
          set -e
          for url in \
            "https://tools.agiscorecard.com/xml-sitemap-generator" \
            "https://tools.agiscorecard.com/meta-tag-generator" \
            "https://tools.agiscorecard.com/faq-schema-generator" \
            "https://tools.agiscorecard.com/acp-feed-converter" \
            "https://tools.agiscorecard.com/mcp-server-card-generator" \
            "https://tools.agiscorecard.com/ai-catalog-generator" \
            "https://agentready.agiscorecard.com/pricing" \
            "https://glossary.agiscorecard.com/ai-agent" \
            "https://glossary.agiscorecard.com/prompt-injection" \
            "https://glossary.agiscorecard.com/mcp-tool"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url did not return 200"; exit 1; }
          done
      - name: Verify monitor endpoint is wired (validation, no side effects)
        run: |
          set -e
          # Invalid email is rejected (400) before any scan or KV write — confirms the route exists.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST "https://agentready.agiscorecard.com/api/monitor" \
            -H "Content-Type: application/json" -d '{"email":"not-an-email","url":"example.com"}' || true)
          echo "/api/monitor invalid-email -> $code"
          [ "$code" = "400" ] || { echo "::error::/api/monitor did not validate (expected 400, got $code)"; exit 1; }
      - name: Verify scanner API end-to-end
        run: |
          set -e
          out=$(curl -s --max-time 60 "https://agentready.agiscorecard.com/api/scan?url=https%3A%2F%2Fwww.cloudflare.com")
          echo "$out" | head -c 600; echo
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d.get('score'), int) and d.get('checks'), d; print('scan OK: score', d['score'], 'grade', d['grade'], len(d['checks']), 'checks')"
      - name: Verify MCP Pulse scanner end-to-end
        run: |
          set -e
          # Scan a well-known public streamable-HTTP MCP endpoint (Cloudflare docs MCP).
          out=$(curl -s --max-time 60 "https://mcppulse.agiscorecard.com/api/scan?url=https%3A%2F%2Fdocs.mcp.cloudflare.com%2Fmcp")
          echo "$out" | head -c 600; echo
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d.get('score'), int) and d.get('checks'), d; print('mcp scan OK: score', d['score'], 'grade', d['grade'], 'latency', d.get('latencyMs'), 'ms')"
      - name: Verify MCP Pulse badge endpoint
        run: |
          set -e
          ctype=$(curl -s -o /dev/null -w "%{content_type}" --max-time 60 "https://mcppulse.agiscorecard.com/api/badge?url=https%3A%2F%2Fdocs.mcp.cloudflare.com%2Fmcp")
          echo "badge content-type: $ctype"
          echo "$ctype" | grep -q "image/svg" || { echo "::error::badge did not return SVG"; exit 1; }
