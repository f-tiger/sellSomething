name: IndexNow submit

on:
  workflow_run:
    workflows: ["Deploy sites to Cloudflare"]
    types: [completed]
  schedule:
    - cron: "0 4 * * 3" # weekly, Wednesday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    # For workflow_run, only fire after a successful deploy; cron/dispatch always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow-submit.mjs
