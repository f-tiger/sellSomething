name: Superteam Earn Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # weekly, Monday 02:00 UTC

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Check for SUPERTEAM_API_KEY
        id: key
        env:
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
        run: |
          if [ -z "$SUPERTEAM_API_KEY" ]; then
            echo "::notice title=Superteam scout skipped::SUPERTEAM_API_KEY secret is not set. Run scripts/superteam/register.mjs --yes once and store the apiKey as a repo secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Scout live listings
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
        run: node scripts/superteam/scout.mjs

      - name: Upload matches
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: superteam-matches
          path: |
            scripts/superteam/out/matches.md
            scripts/superteam/out/matches.json
          if-no-files-found: warn
          retention-days: 30
